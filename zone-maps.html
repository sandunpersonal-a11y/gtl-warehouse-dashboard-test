function updateStatus(){statusButtons();const all=filteredRows();updateKpis(all);document.querySelectorAll('.floor').forEach(floor=>{floor.classList.toggle('single-status',false);floor.querySelectorAll('g[data-zone]').forEach(g=>{const r=g._r,ok=visibleRow(r);g.querySelectorAll('.fill').forEach(rect=>{const k=rect.dataset.kind;const dominant=KEYS.reduce((best,key)=>amount(r,key)>amount(r,best)?key:best,KEYS[0]);const show=ok&&(status==='all'?true:status===k);rect.style.opacity=show?'.43':'0';rect.classList.remove('zone-reveal');if(rect.style.opacity!=='0'&&floor.dataset.visible==='yes')requestAnimationFrame(()=>rect.classList.add('zone-reveal'));});g.querySelectorAll('.snow-overlay').forEach(el=>{el.style.opacity=ok&&(status==='all'||status===el.dataset.kind)?'.12':'0'});g.style.opacity='1'});floor.querySelectorAll('.zone-tile').forEach(t=>paintTile(t,t._r));const detail=floor.querySelector('.detail');if(detail)detail.hidden=true})}

let zoneObserver;
function startZoneObservers(){
 if(zoneObserver)zoneObserver.disconnect();
 zoneObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
  if(!entry.isIntersecting)return;
  const floor=entry.target;
  floor.dataset.visible='yes';
  floor.querySelectorAll('.fill').forEach(el=>{
   if(el.style.opacity==='0')return;
   el.classList.remove('zone-reveal');void el.getBoundingClientRect();el.classList.add('zone-reveal');
  });
 }),{threshold:0.12,rootMargin:'0px 0px -8% 0px'});

}

  else{rail.classList.remove('is-pinned');rail.style.left='';rail.style.width='';}
